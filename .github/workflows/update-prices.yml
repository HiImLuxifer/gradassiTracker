name: 📊 Aggiornamento Prezzi Giornaliero

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (08:00 ora italiana)
    - cron: '0 6 * * *'
  # Permetti esecuzione manuale dal tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci

      - name: 🏷️ Aggiorna prezzi Sealed
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: npm run update-prices:sealed

      - name: 🃏 Aggiorna prezzi Carte
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: npm run update-prices:cards

      - name: 📤 Commit e Push dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/it-prices.json
          # Commit solo se ci sono cambiamenti
          git diff --staged --quiet || git commit -m "📊 Aggiornamento prezzi automatico $(date -u +%Y-%m-%d)"
          git push
